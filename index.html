<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LinguaPath — Learn English from A1 to C1</title>
  <meta name="description" content="LinguaPath: a local-first, interactive English course from A1 to C1. No account, no server — your progress stays in your browser.">
  <meta name="theme-color" content="#13808a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2313808a'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='26' fill='white' text-anchor='middle'%3ELP%3C/text%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply the saved theme before the page is drawn, to avoid a flash.
    try {
      var s = JSON.parse(localStorage.getItem('linguapath.v1') || '{}').settings || {};
      var dark = s.theme === 'dark' || ((!s.theme || s.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) { /* ignore */ }
  </script>
  <script>
  window.va = window.va || function () {
    (window.vaq = window.vaq || []).push(arguments);
  };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>

  <a class="skip-link" href="#main">Skip to content</a>

      <div class="side-foot" id="side-foot"></div>

  <div class="more-sheet" id="more-sheet" aria-label="More pages"></div>
